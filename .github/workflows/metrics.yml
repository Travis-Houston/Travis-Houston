name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          user: travis-houston
          template: terminal
          filename: metrics.terminal.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: header, metadata

          plugin_languages: yes
          plugin_languages_limit: 10