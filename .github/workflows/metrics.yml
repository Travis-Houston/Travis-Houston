name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *" # Daily at 00:00 UTC / 07:00 Vietnam time

  push:
    branches:
      - master
      - main
    paths-ignore:
      - metrics.terminal.svg
      - metrics.code.svg

  workflow_dispatch:

concurrency:
  group: github-metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate terminal metrics
        uses: lowlighter/metrics@latest
        with:
          user: travis-houston
          template: terminal
          filename: metrics.terminal.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: "header, metadata"
          config_timezone: Asia/Ho_Chi_Minh
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_other: yes
          retries: 3
          retries_delay: 10
          retries_output_action: 3
          retries_delay_output_action: 10

      - name: Generate random code snippet
        uses: lowlighter/metrics@latest
        with:
          user: travis-houston
          template: classic
          filename: metrics.code.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          config_timezone: Asia/Ho_Chi_Minh
          retries: 3
          retries_delay: 10
          retries_output_action: 3
          retries_delay_output_action: 10

          plugin_code: yes
          plugin_code_lines: 12
          plugin_code_load: 400
          plugin_code_days: 3
          plugin_code_visibility: public
          plugin_code_languages: >-
            go, python, bash, yaml, dockerfile,
            javascript, typescript