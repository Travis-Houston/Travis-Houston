name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          user: travis-houston
          template: terminal
          filename: metrics.terminal.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: header, metadata

      - uses: lowlighter/metrics@latest
        with:
          user: travis-houston
          template: classic
          filename: metrics.code.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_code: yes
          plugin_code_lines: 12
          plugin_code_load: 400
          plugin_code_days: 3
          plugin_code_visibility: public
          plugin_code_languages: go, python, bash, yaml, dockerfile, javascript, typescript, html, css, json, markdown, sql, rust, java, c, cpp, csharp, cs, kotlin, php, ruby, swift, r, dart, scala, perl, lua, haskell, elixir, clojure
